services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_PATH: /data/fivebones.sqlite3
      DATABASE_URL: ${DATABASE_URL:-}
      APP_ENV: ${APP_ENV:-development}
      PORT: 8000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,https://app.roll20.net}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:5173,https://app.roll20.net}
      HOST_INVITE_SECRET: ${HOST_INVITE_SECRET:-}
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - bones-data:/data
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
    ports:
      - '127.0.0.1:5173:8080'
    depends_on:
      - api
    restart: unless-stopped
volumes:
  bones-data:
